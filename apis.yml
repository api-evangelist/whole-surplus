aid: whole-surplus
name: Whole Surplus
description: >-
  Whole Surplus (now operating as Fazla) is a Turkish technology-based waste
  management and circular-economy company backed by Techstars. It prevents waste
  at its source and recovers surplus products back into the circular economy with
  maximum environmental, social, and economic benefit across the entire supply
  chain from producers to consumers. Its platform combines an AI-powered analysis
  tool that identifies the optimal recovery path for each product with services
  including Fazla Market (discounted resale), donations to food banks, animal-feed
  conversion, recycling, a smart-scale detection system, and sustainability
  consultancy. Fazla is the first B Corp certified waste-management company in
  Turkey and is supported by the UN Development Programme (UNDP). The company
  operates a customer web application (app.fazla.com) but publishes no public API,
  developer portal, SDKs, or machine-readable specification at this time.
